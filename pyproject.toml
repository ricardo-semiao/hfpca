[project]
name = "hfpca"
version = "0.1.0"
description = "Principal component analysis (PCA) for high-frequency time-series data, as proposed in Aït-Sahalia and Xiu (2019)."
readme = "README.md"
authors = [
    { name = "ricardo-semiao", email = "ricardo.semiao@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "plotnine>=0.15.8",
    "polars>=1.44.2",
    "tdqm>=0.0.1",
    "types-tqdm>=4.70.0.20260906",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-regressions",
    "pytest-mpl",
    "ruff>=0.16.10",
    "pydoclint>=0.11.1",
]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "tests"]
#python_files = ["test_*.py"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
extend-select = ["W291", "W293"]
preview = true
ignore = ["I001"]

[tool.mypy]
strict = true
disallow_untyped_defs = true      # Requires all function parameters and return types
disallow_incomplete_defs = true   # Prevents partially annotated functions
check_untyped_defs = true         # Checks expressions inside untyped function bodies
disallow_untyped_calls = false # Ignore untyped calls inside code that uses plotting/external libraries

# TODO: add more testing tools configs
